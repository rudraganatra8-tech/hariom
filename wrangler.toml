name = "hariom-v1"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Every page and file goes through the worker first so it can add the security headers.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Runs every minute: sends due WhatsApp messages and your own phone notifications.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "hariom-db"
database_id = "f77f4df4-b7e7-421f-add8-8849d33e6e04"
